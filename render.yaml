services:
  - type: web
    name: jimin-birthday
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
